name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read      

jobs:
  test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: api_tester
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn clean test
        env:
          DB_HOST: 127.0.0.1
          MYSQL_DATABASE: api_tester
          DB_USERNAME: root
          DB_PASSWORD: password
          JWT_SECRET: test-secret-for-ci-123456789012345678901234

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -t api-tester-backend:${{ github.sha }} .   

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::495791792589:role/GitHubActionsApiTesterECR
          aws-region: ap-south-1

      - name: Verify AWS identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity     