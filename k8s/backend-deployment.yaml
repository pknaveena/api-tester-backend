apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-tester-backend
  namespace: api-tester

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-tester-backend

  template:
    metadata:
      labels:
        app: api-tester-backend

    spec:
      containers:
        - name: api-tester-backend
          image: api-tester-backend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: api-tester-config

            - secretRef:
                name: api-tester-secret

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
