spring:
  application:
    name: api-tester-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${MYSQL_DATABASE:api_tester}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true  

    properties:
      hibernate:
        format_sql: true

server:
  port: 8080   

security:
  jwt:
    secret: ${JWT_SECRET}      

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true  

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  info:
    env:
      enabled: true

info:
  app:
    name: API Tester
    version: 1.0.0

